# DashDiag own-code rig: sync origin/main each cycle, uniform fuzztime across
# all auto-discovered targets, open a PR with any reproducer.
MODULE_DIR=/opt/dashdiag-fuzz/dashdiag
SOURCE_MODE=git
GIT_REMOTE=origin
GIT_BRANCH=main
CRASH_MODE=pr
CORPUS_BRANCH=fuzz/corpus-updates
DEFAULT_FUZZTIME=15m
PARALLEL=4
STATE_DIR=/opt/dashdiag-fuzz/state
LOG_DIR=/opt/dashdiag-fuzz/logs
FINDINGS_DIR=/opt/dashdiag-fuzz/findings
