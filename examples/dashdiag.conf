# DashDiag own-code rig: sync origin/main each cycle, uniform fuzztime across
# all auto-discovered targets. Crashers go to the PRIVATE fuzz-corpus repo (NOT
# a public PR) so an unfixed vuln is not disclosed before the fix. Growing corpus
# is backed up off-box to the same private repo.
MODULE_DIR=/home/andrei/proj/dashdiag
SOURCE_MODE=git
GIT_REMOTE=origin
GIT_BRANCH=main
CRASH_MODE=private
DEFAULT_FUZZTIME=15m
PARALLEL=4
STATE_DIR=/home/andrei/proj/dashdiag-harness-state
LOG_DIR=/home/andrei/proj/dashdiag-harness-logs
FINDINGS_DIR=/home/andrei/proj/dashdiag-harness-findings

CORPUS_SYNC=on
# CORPUS_REPO uses the SSH deploy-key alias from migration/provision-deploy-key.sh
CORPUS_REPO=git@github-fuzzcorpus:keyorixhq/fuzz-corpus.git
CORPUS_PROJECT=dashdiag
