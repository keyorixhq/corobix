# DashDiag own-code rig: sync origin/main each cycle, uniform fuzztime across
# all auto-discovered targets. Crashers go to the PRIVATE fuzz-corpus repo (NOT
# a public PR) so an unfixed vuln is not disclosed before the fix. Growing corpus
# is backed up off-box to the same private repo.
MODULE_DIR=/home/andrei/proj/dashdiag
SOURCE_MODE=git
GIT_REMOTE=origin
GIT_BRANCH=main
# REPORT_MODE: where a confirmed crash reproducer is reported.
#   local   = keep on the rig only (never published)
#   private = push to the private CORPUS_REPO (default for this security product)
#   pr      = open a PUBLIC pull request on the source repo
#   issue   = open a PUBLIC GitHub issue on the source repo (repro POINTER only;
#             the raw crashing input is NOT posted — it stays local/private)
# pr/issue are refused for a standalone (third-party) module (0-day disclosure)
# and publish only for own-code git rigs. Keep 'private' unless you deliberately
# want a public finding. (CRASH_MODE = deprecated former name, still honored.)
REPORT_MODE=private
DEFAULT_FUZZTIME=15m
PARALLEL=4
STATE_DIR=/home/andrei/proj/dashdiag-harness-state
LOG_DIR=/home/andrei/proj/dashdiag-harness-logs
FINDINGS_DIR=/home/andrei/proj/dashdiag-harness-findings

CORPUS_SYNC=on
# CORPUS_REPO uses the SSH deploy-key alias from migration/provision-deploy-key.sh
CORPUS_REPO=git@github-fuzzcorpus:keyorixhq/fuzz-corpus.git
CORPUS_PROJECT=dashdiag

# --- exec-rate-scaled confirmation slices (2026-09-14) -----------------------
# The ~55 dashdiag parsers are saturated and cheap (µs/exec), so this is where the
# gain is largest: a saturated parser drops from 15m to ~1-2m, cycling the whole
# set far faster and freeing cores. Once a target SATURATES (>=3 recorded runs,
# zero new coverage) its slice becomes max(CONFIRM_EXEC_BUDGET/exec_rate,
# warmup*CONFIRM_WARMUP_MULT, CONFIRM_MIN_SLICE), capped at DEFAULT_FUZZTIME.
# Fail-safe: still-growing / unmeasured targets keep the full budget. Records its
# own saturation history — no NOTIFY_URL required.
REWEIGHT_CONFIRM=on
# CONFIRM_EXEC_BUDGET=5000000   # fresh execs a saturated target runs to reconfirm "no new coverage"
# CONFIRM_MIN_SLICE=60          # absolute floor, seconds
# CONFIRM_WARMUP_MULT=10        # slice must be >= this * the measured corpus-replay warm-up

# --- crash re-verify (2026-09-14, default on) --------------------------------
# A `go test -fuzz` non-zero exit that leaves a reproducer is REPLAYED before we
# alert/push: a transient fuzz-worker death (watchdog kill under load, e.g. during a
# corpus git-push) that replays clean is kept locally but NOT paged or pushed to the
# shared crasher repo — only a confirmed-reproducing input is. Defaults on.
# REVERIFY_CRASH=on     # off = old always-alert behavior
# REVERIFY_RUNS=1       # replay N times; ANY failure = real crash
# REVERIFY_TIMEOUT=2m   # per-replay timeout (a reproducible hang still counts as real)

# Cap Go's per-input minimization on packages with a big coverage map (>100 KB,
# measured automatically). Removes minimization stalls with identical coverage;
# no effect on small packages. See README (MINIMIZE_CAP).
MINIMIZE_CAP=on
# MINIMIZE_CAP_VALUE=100x
# MINIMIZE_CAP_THRESHOLD=100000
