# Keyorix own-code rig: sync origin/main each cycle, per-target durations
# weighted toward where coverage is still growing (notary RFC3161/PKCS#7 DoS
# surface). Crashers go to the PRIVATE fuzz-corpus repo (NOT a public PR) so an
# unfixed own-code vuln is never disclosed publicly before the fix ships. The
# growing corpus is backed up off-box to the same private repo.
MODULE_DIR=/opt/keyorix-fuzz/keyorix
SOURCE_MODE=git
GIT_REMOTE=origin
GIT_BRANCH=main
# REPORT_MODE: where a confirmed crash reproducer is reported.
#   local   = keep on the rig only (never published)
#   private = push to the private CORPUS_REPO (default for this security product)
#   pr      = open a PUBLIC pull request on the source repo
#   issue   = open a PUBLIC GitHub issue on the source repo (repro POINTER only;
#             the raw crashing input is NOT posted — it stays local/private)
# pr/issue are refused for a standalone (third-party) module (0-day disclosure)
# and publish only for own-code git rigs. Keep 'private' unless you deliberately
# want a public finding. (CRASH_MODE = deprecated former name, still honored.)
REPORT_MODE=private
DEFAULT_FUZZTIME=1h
PARALLEL=4
STATE_DIR=/opt/keyorix-fuzz/harness-state
LOG_DIR=/opt/keyorix-fuzz/harness-logs
FINDINGS_DIR=/opt/keyorix-fuzz/harness-findings

# Off-box corpus + crasher backup (private repo; needs the rig's PAT scoped to it).
CORPUS_SYNC=on
# CORPUS_REPO uses the SSH deploy-key alias from migration/provision-deploy-key.sh
CORPUS_REPO=git@github-fuzzcorpus:keyorixhq/fuzz-corpus.git
CORPUS_PROJECT=keyorix
# NOTIFY_URL is set only in the box-local fuzz.conf (private ntfy topic), not here.

# Per-target overrides (mirror scripts/fuzzing/targets.conf, rebalanced
# 2026-09-13 from live saturation data). Anything not listed uses DEFAULT_FUZZTIME=1h.
DURATION_FuzzVerifyReceipt=3h
DURATION_FuzzRFC3161Anchor=2h
DURATION_FuzzOIDCVerifierVerify=2h

# --- exec-rate-scaled confirmation slices (2026-09-14) -----------------------
# Once a target SATURATES (>=3 recorded runs, zero new coverage), size its next
# slice from its OWN measured throughput instead of the fixed budget above:
#   confirm = max(CONFIRM_EXEC_BUDGET/exec_rate, warmup*CONFIRM_WARMUP_MULT,
#                 CONFIRM_MIN_SLICE), capped at the configured budget.
# Saturated fast targets collapse to ~1-2m (freeing cores for still-growing ones);
# slow/crypto targets stay proportionally longer. Fail-safe: a still-growing or
# not-yet-measured target keeps its full budget. Records the saturation history it
# needs on its own — no NOTIFY_URL / SATURATION_REPORT required.
REWEIGHT_CONFIRM=on
# CONFIRM_EXEC_BUDGET=5000000   # fresh execs a saturated target runs to reconfirm "no new coverage"
# CONFIRM_MIN_SLICE=60          # absolute floor, seconds
# CONFIRM_WARMUP_MULT=10        # slice must be >= this * the measured corpus-replay warm-up

# --- crash re-verify (2026-09-14, default on) --------------------------------
# A `go test -fuzz` non-zero exit that leaves a reproducer is REPLAYED before we
# alert/push: a transient fuzz-worker death (watchdog kill under load, e.g. during a
# corpus git-push) that replays clean is kept locally but NOT paged or pushed to the
# shared crasher repo — only a confirmed-reproducing input is. Defaults on.
# REVERIFY_CRASH=on     # off = old always-alert behavior
# REVERIFY_RUNS=1       # replay N times; ANY failure = real crash
# REVERIFY_TIMEOUT=2m   # per-replay timeout (a reproducible hang still counts as real)
