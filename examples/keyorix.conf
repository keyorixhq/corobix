# Keyorix own-code rig: sync origin/main each cycle, per-target durations
# weighted toward where coverage is still growing (notary RFC3161/PKCS#7 DoS
# surface), open a PR with any reproducer.
MODULE_DIR=/opt/keyorix-fuzz/keyorix
SOURCE_MODE=git
GIT_REMOTE=origin
GIT_BRANCH=main
CRASH_MODE=pr
CORPUS_BRANCH=fuzz/corpus-updates
DEFAULT_FUZZTIME=1h
PARALLEL=4
STATE_DIR=/opt/keyorix-fuzz/harness-state
LOG_DIR=/opt/keyorix-fuzz/harness-logs
FINDINGS_DIR=/opt/keyorix-fuzz/harness-findings
# NOTIFY_URL is set only in the box-local fuzz.conf (private ntfy topic), not here.
# NOTE: this rig's old runner also streamed the growing corpus to a fuzz-corpus
# branch; the universal runner does not (see MIGRATION.md).

# Per-target overrides (mirror scripts/fuzzing/targets.conf, rebalanced
# 2026-09-13 from live saturation data). Anything not listed uses DEFAULT_FUZZTIME=1h.
DURATION_FuzzVerifyReceipt=3h
DURATION_FuzzRFC3161Anchor=2h
DURATION_FuzzOIDCVerifierVerify=2h
