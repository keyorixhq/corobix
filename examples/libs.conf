# Third-party libraries rig (go-webauthn / crewjam-saml / golang-jwt).
# standalone: fuzz the tree as-is (no repo sync). Crashers are pre-disclosure
# 0-day material for someone else's code, so they go to the PRIVATE fuzz-corpus
# repo (private mode) and NEVER to a public PR — the runner also refuses to
# downgrade a standalone crash to a public PR. Growing corpus is backed up to the
# same private repo (a coverage-boundary input for undisclosed code is itself
# sensitive, so the destination must be private).
MODULE_DIR=/root/libs-fuzz
SOURCE_MODE=standalone
CRASH_MODE=private
DEFAULT_FUZZTIME=8m
PARALLEL=4
STATE_DIR=/root/libs-fuzz-state
LOG_DIR=/root/libs-fuzz-logs
FINDINGS_DIR=/root/libs-fuzz-findings

CORPUS_SYNC=on
CORPUS_REPO=https://github.com/keyorixhq/fuzz-corpus.git
CORPUS_PROJECT=libs
# per-target duration overrides go here if needed, e.g.:
# DURATION_FuzzSAMLParseXMLResponse=12m
