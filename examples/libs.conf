# Third-party libraries rig (go-webauthn / crewjam-saml / golang-jwt).
# standalone: fuzz the tree as-is (no repo sync). Crashers are pre-disclosure
# 0-day material for someone else's code, so they go to the PRIVATE fuzz-corpus
# repo (private mode) and NEVER to a public PR — the runner also refuses to
# downgrade a standalone crash to a public PR. Growing corpus is backed up to the
# same private repo (a coverage-boundary input for undisclosed code is itself
# sensitive, so the destination must be private).
MODULE_DIR=/root/libs-fuzz
SOURCE_MODE=standalone
# REPORT_MODE: where a confirmed crash reproducer is reported.
#   local   = keep on the rig only (never published)
#   private = push to the private CORPUS_REPO (default for this security product)
#   pr      = open a PUBLIC pull request on the source repo
#   issue   = open a PUBLIC GitHub issue on the source repo (repro POINTER only;
#             the raw crashing input is NOT posted — it stays local/private)
# pr/issue are refused for a standalone (third-party) module (0-day disclosure)
# and publish only for own-code git rigs. Keep 'private' unless you deliberately
# want a public finding. (CRASH_MODE = deprecated former name, still honored.)
REPORT_MODE=private
DEFAULT_FUZZTIME=8m
PARALLEL=4
STATE_DIR=/root/libs-fuzz-state
LOG_DIR=/root/libs-fuzz-logs
FINDINGS_DIR=/root/libs-fuzz-findings

CORPUS_SYNC=on
# CORPUS_REPO uses the SSH deploy-key alias from migration/provision-deploy-key.sh
CORPUS_REPO=git@github-fuzzcorpus:keyorixhq/fuzz-corpus.git
CORPUS_PROJECT=libs
# Advisory per-target growth digest to NOTIFY_URL (never auto-excludes).
SATURATION_REPORT=on

# Rearranged 2026-09-13 from saturation + upstream-fuzzing research:
#   - JWT id_token parse: saturated (flat ~368 over 58 runs) -> excluded.
#   - WebAuthn credential response: go-webauthn is fuzzed upstream (redundant) -> excluded.
#   - Added two UPSTREAM-UNFUZZED targets: FuzzEtreeParse (beevik/etree raw XML,
#     Scorecard 0) and FuzzWebAuthnXASN1 (go-webauthn/x custom ASN.1, Scorecard 0,
#     a ber2der-analogue). SAML kept (still growing).
# NOTE: EXCLUDE is sourced as shell, so MULTIPLE names MUST be quoted (a bare
# space makes bash treat the rest as a command). Corpus of excluded targets is
# kept, not deleted — re-enable by removing the name here.
EXCLUDE="FuzzJWTParseIDToken FuzzWebAuthnCredentialResponse"
DURATION_FuzzSAMLParseXMLResponse=30m
DURATION_FuzzEtreeParse=20m
DURATION_FuzzWebAuthnXASN1=20m

# --- exec-rate-scaled confirmation slices (2026-09-14) -----------------------
# Once a target SATURATES (>=3 recorded runs, zero new coverage) its slice becomes
# max(CONFIRM_EXEC_BUDGET/exec_rate, warmup*CONFIRM_WARMUP_MULT, CONFIRM_MIN_SLICE),
# capped at the configured budget above. XML/ASN.1 parsers that flatten drop to a
# short confirmation slice; SAML (still growing) and any slow target keep their
# long budget until they saturate. Fail-safe: still-growing / unmeasured targets
# keep the full budget. (SATURATION_REPORT is already on here.)
REWEIGHT_CONFIRM=on
# CONFIRM_EXEC_BUDGET=5000000   # fresh execs a saturated target runs to reconfirm "no new coverage"
# CONFIRM_MIN_SLICE=60          # absolute floor, seconds
# CONFIRM_WARMUP_MULT=10        # slice must be >= this * the measured corpus-replay warm-up

# --- crash re-verify (2026-09-14, default on) --------------------------------
# A `go test -fuzz` non-zero exit that leaves a reproducer is REPLAYED before we
# alert/push: a transient fuzz-worker death (watchdog kill under load, e.g. during a
# corpus git-push) that replays clean is kept locally but NOT paged or pushed to the
# shared crasher repo — only a confirmed-reproducing input is. Defaults on.
# REVERIFY_CRASH=on     # off = old always-alert behavior
# REVERIFY_RUNS=1       # replay N times; ANY failure = real crash
# REVERIFY_TIMEOUT=2m   # per-replay timeout (a reproducible hang still counts as real)

# Cap Go's per-input minimization on packages with a big coverage map (>100 KB,
# measured automatically). Removes minimization stalls with identical coverage;
# no effect on small packages. See README (MINIMIZE_CAP).
MINIMIZE_CAP=on
# MINIMIZE_CAP_VALUE=100x
# MINIMIZE_CAP_THRESHOLD=100000
