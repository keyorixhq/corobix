# Third-party libraries rig (go-webauthn / crewjam-saml / golang-jwt).
# standalone: fuzz the tree as-is (no repo sync). Crashers are pre-disclosure
# 0-day material for someone else's code, so they go to the PRIVATE fuzz-corpus
# repo (private mode) and NEVER to a public PR — the runner also refuses to
# downgrade a standalone crash to a public PR. Growing corpus is backed up to the
# same private repo (a coverage-boundary input for undisclosed code is itself
# sensitive, so the destination must be private).
MODULE_DIR=/root/libs-fuzz
SOURCE_MODE=standalone
CRASH_MODE=private
DEFAULT_FUZZTIME=8m
PARALLEL=4
STATE_DIR=/root/libs-fuzz-state
LOG_DIR=/root/libs-fuzz-logs
FINDINGS_DIR=/root/libs-fuzz-findings

CORPUS_SYNC=on
# CORPUS_REPO uses the SSH deploy-key alias from migration/provision-deploy-key.sh
CORPUS_REPO=git@github-fuzzcorpus:keyorixhq/fuzz-corpus.git
CORPUS_PROJECT=libs

# Rebalanced 2026-09-13 from saturation data: JWT id_token parse saturated (0 new
# interesting over a full 8m run, ~7.7h), so drop it from rotation — the corpus
# is already backed up and golang-jwt is pinned, so nothing re-opens until a bump.
# SAML response XML (crewjam/saml) still climbs fastest (+2..5/run, attacker-facing
# parse) and WebAuthn still trickles, so weight time toward them.
EXCLUDE=FuzzJWTParseIDToken
DURATION_FuzzSAMLParseXMLResponse=15m
DURATION_FuzzWebAuthnCredentialResponse=10m
