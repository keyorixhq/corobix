# Third-party libraries rig (go-webauthn / crewjam-saml / golang-jwt).
# standalone: fuzz the tree as-is (no repo sync). Crashers are pre-disclosure
# 0-day material for someone else's code, so they go to the PRIVATE fuzz-corpus
# repo (private mode) and NEVER to a public PR — the runner also refuses to
# downgrade a standalone crash to a public PR. Growing corpus is backed up to the
# same private repo (a coverage-boundary input for undisclosed code is itself
# sensitive, so the destination must be private).
MODULE_DIR=/root/libs-fuzz
SOURCE_MODE=standalone
CRASH_MODE=private
DEFAULT_FUZZTIME=8m
PARALLEL=4
STATE_DIR=/root/libs-fuzz-state
LOG_DIR=/root/libs-fuzz-logs
FINDINGS_DIR=/root/libs-fuzz-findings

CORPUS_SYNC=on
# CORPUS_REPO uses the SSH deploy-key alias from migration/provision-deploy-key.sh
CORPUS_REPO=git@github-fuzzcorpus:keyorixhq/fuzz-corpus.git
CORPUS_PROJECT=libs
# Advisory per-target growth digest to NOTIFY_URL (never auto-excludes).
SATURATION_REPORT=on

# Rearranged 2026-09-13 from saturation + upstream-fuzzing research:
#   - JWT id_token parse: saturated (flat ~368 over 58 runs) -> excluded.
#   - WebAuthn credential response: go-webauthn is fuzzed upstream (redundant) -> excluded.
#   - Added two UPSTREAM-UNFUZZED targets: FuzzEtreeParse (beevik/etree raw XML,
#     Scorecard 0) and FuzzWebAuthnXASN1 (go-webauthn/x custom ASN.1, Scorecard 0,
#     a ber2der-analogue). SAML kept (still growing).
# NOTE: EXCLUDE is sourced as shell, so MULTIPLE names MUST be quoted (a bare
# space makes bash treat the rest as a command). Corpus of excluded targets is
# kept, not deleted — re-enable by removing the name here.
EXCLUDE="FuzzJWTParseIDToken FuzzWebAuthnCredentialResponse"
DURATION_FuzzSAMLParseXMLResponse=30m
DURATION_FuzzEtreeParse=20m
DURATION_FuzzWebAuthnXASN1=20m
