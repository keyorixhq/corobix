# Third-party libraries rig, second batch (crewjam-saml xmlenc / digitorus
# timestamp+pkcs7 / mattermost xml-roundtrip-validator / golang-jwt signature-
# bypass template). standalone: fuzz the tree as-is (no repo sync). Crashers
# are pre-disclosure 0-day material for someone else's code, so they go to the
# PRIVATE fuzz-corpus repo (private mode) and NEVER to a public PR — the
# runner also refuses to downgrade a standalone crash to a public PR. Growing
# corpus is backed up to the same private repo (a coverage-boundary input for
# undisclosed code is itself sensitive, so the destination must be private).
MODULE_DIR=/home/andrei/proj/libs-extra-fuzz
SOURCE_MODE=standalone
# See examples/libs.conf for the REPORT_MODE value meanings. Keep 'private'
# unless you deliberately want a public finding.
REPORT_MODE=private
DEFAULT_FUZZTIME=8m
PARALLEL=4
STATE_DIR=/home/andrei/proj/libs-extra-fuzz-state
LOG_DIR=/home/andrei/proj/libs-extra-fuzz-logs
FINDINGS_DIR=/home/andrei/proj/libs-extra-fuzz-findings

CORPUS_SYNC=on
# CORPUS_REPO uses the SSH deploy-key alias from migration/provision-deploy-key.sh
CORPUS_REPO=git@github-fuzzcorpus:keyorixhq/fuzz-corpus.git
CORPUS_PROJECT=libs-extra
# Advisory per-target growth digest to NOTIFY_URL (never auto-excludes).
SATURATION_REPORT=on

# No EXCLUDE here. FuzzTimestampParseResponse was excluded on the (now-
# decommissioned vcd-dashdiag) rig's box-local fuzz.conf pending an upstream
# digitorus/pkcs7 ber.go OOB-panic fix -- that fuzz.conf was never checked
# into this repo (box-local/gitignored by design), so this is the first
# checked-in example for this module. Verified 2026-09-22: the panic
# reproduces on the old pin (v0.0.0-20230713084857) but does NOT reproduce
# against the version keyorix actually ships (v0.0.0-20260914070511, this
# module's go.mod as of the pin-rebase commit) -- 302/302 archived corpus
# entries pass clean. Re-add an EXCLUDE line here only if a fresh regression
# is found on the current pin, with a comment citing the reproducer.
